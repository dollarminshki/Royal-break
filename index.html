<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Royal Break | 3D Pool</title>
<style>
:root{--gold:#e7c47c;--panel:#101a16;--line:#34483d}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07100c;color:#f7f4eb;font-family:Inter,system-ui,Arial}
#game{position:fixed;inset:0}canvas{display:block}
.hud{position:fixed;inset:0;pointer-events:none;padding:16px;display:flex;flex-direction:column;justify-content:space-between}
.top,.bottom{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.bottom{align-items:flex-end}
.brand{font-size:18px;font-weight:900;letter-spacing:.18em}.brand span{color:var(--gold)}.sub{font-size:9px;letter-spacing:.25em;color:#aebbb2;margin-top:4px}
.pill{background:#09130fe8;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:12px;backdrop-filter:blur(10px)}
.controls{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end;pointer-events:auto;align-items:center}
button,select{background:#132019;color:#f7f4eb;border:1px solid #405748;border-radius:10px;padding:10px 12px;font-weight:750;font-size:12px}
button{cursor:pointer}button:hover,select:hover{border-color:var(--gold)}button.gold{background:linear-gradient(135deg,#f0d28e,#a87936);color:#1b160b;border:0}
#power{width:105px;vertical-align:middle;accent-color:var(--gold)}
#hint{max-width:310px;line-height:1.4;color:#d6dfd8;font-size:12px}
#menu{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:18px;background:#050a08eF}
.card{width:min(540px,100%);padding:30px;border-radius:22px;background:linear-gradient(145deg,#17271f,#0a110d);border:1px solid #43594b;box-shadow:0 25px 90px #000b}
.eyebrow{color:var(--gold);font-size:10px;font-weight:900;letter-spacing:.28em}.card h1{font-size:clamp(38px,8vw,60px);line-height:.92;margin:12px 0}.card p{color:#b7c4bb;line-height:1.55;font-size:14px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.mode{padding:18px;text-align:left;border-radius:15px;background:#0b1510}.mode b{display:block;color:var(--gold);font-size:22px;margin-bottom:5px}.mode small{color:#aebbb2;line-height:1.4}
#toast{position:fixed;top:17%;left:50%;transform:translateX(-50%);padding:10px 16px;background:#09130fee;border:1px solid #506956;border-radius:30px;color:#f1d89f;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
@media(max-width:650px){.hud{padding:10px}.brand{font-size:14px}.pill{font-size:10px;padding:8px}.bottom{align-items:flex-end}.controls{max-width:67%}button,select{font-size:10px;padding:9px 8px}#power{width:70px}#hint{max-width:130px;font-size:10px}.card{padding:22px}}
</style>
</head>
<body>
<div id="game"></div>
<div class="hud">
 <div class="top"><div><div class="brand">ROYAL <span>BREAK</span></div><div class="sub">3D BILLIARDS CLUB</div></div><div class="pill"><b id="modeLabel">8 BALL</b> · <span id="turnLabel">PLAYER 1</span></div></div>
 <div class="bottom"><div class="pill" id="hint">Drag backwards from the cue ball, then release to shoot.</div><div class="controls">
  <select id="camera" aria-label="Camera view"><option value="angled">Angled</option><option value="top">Top down</option><option value="side">Side</option><option value="free">Free orbit</option></select>
  <label class="pill">POWER <input id="power" type="range" min="10" max="100" value="58"></label>
  <button id="rack">RACK</button><button id="menuBtn">MENU</button>
 </div></div>
</div>
<div id="toast"></div>
<div id="menu"><div class="card">
 <div class="eyebrow">THE DIGITAL POOL HALL</div><h1>ROYAL<br><span style="color:var(--gold)">BREAK.</span></h1>
 <p>Choose a game. This build focuses on correcting the supplied table alignment, cue control and ball physics before adding full competitive rules.</p>
 <div class="modes"><button class="mode" data-mode="8"><b>8 BALL</b><small>Solids, stripes and the black eight.</small></button><button class="mode" data-mode="9"><b>9 BALL</b><small>Play the lowest numbered ball first.</small></button></div>
 <button class="gold" id="start" style="width:100%;padding:14px">START PRACTICE</button>
</div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {OBJLoader} from 'three/addons/loaders/OBJLoader.js';
import {MTLLoader} from 'three/addons/loaders/MTLLoader.js';

const $=id=>document.getElementById(id), host=$('game');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07100c);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.01,40);
camera.position.set(2.55,2.25,3.15);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd9eee0,0x182019,2.1));
const key=new THREE.DirectionalLight(0xffe8c4,2.7);key.position.set(-2.5,4.5,3);key.castShadow=true;key.shadow.mapSize.set(2048,2048);scene.add(key);
const fill=new THREE.PointLight(0x75c5a2,22,8);fill.position.set(1.5,2.4,-2);scene.add(fill);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,.73,0);controls.minDistance=1.7;controls.maxDistance=6;controls.maxPolarAngle=Math.PI*.49;
const tableRoot=new THREE.Group();scene.add(tableRoot);
const ballsRoot=new THREE.Group();scene.add(ballsRoot);
const aimRoot=new THREE.Group();scene.add(aimRoot);
let mode='8',balls=[],cueBall=null,tableLoaded=false,selectedMode='8',dragging=false,dragPoint=null,shotActive=false,turn=1,shotTimer=0;
const R=.0345, CLOTH_Y=.686, BALL_Y=CLOTH_Y+R, FIELD_X=.835, FIELD_Z=.385;
const POCKET_R=.064, POCKETS=[[-.86,-.405],[0,-.405],[.86,-.405],[-.86,.405],[0,.405],[.86,.405]];
const palette={1:0xf3d21b,2:0x2368d5,3:0xd52b32,4:0x713aa0,5:0xf07b20,6:0x18894d,7:0x8d2633,8:0x101010,9:0xf3d21b,10:0x2368d5,11:0xd52b32,12:0x713aa0,13:0xf07b20,14:0x18894d,15:0x8d2633};
const sphereGeo=new THREE.SphereGeometry(R,32,24);
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(), playPlane=new THREE.Plane(new THREE.Vector3(0,1,0),-BALL_Y);
function toast(msg){$('toast').textContent=msg;$('toast').style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.opacity=0,1800)}
function clearGroup(g){while(g.children.length){const o=g.children.pop();if(o.geometry)o.geometry.dispose();}}
function makeBall(n,x,z){
 const g=new THREE.Group();const m=new THREE.MeshStandardMaterial({color:n===0?0xffffff:palette[n],roughness:.18,metalness:.02});
 const s=new THREE.Mesh(sphereGeo,m);s.castShadow=true;s.receiveShadow=true;g.add(s);
 if(n!==0){
  if(n>=9){const band=new THREE.Mesh(new THREE.CylinderGeometry(R*.94,R*.94,R*.48,32,1,true),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.24}));band.rotation.z=Math.PI/2;g.add(band);}
  const c=document.createElement('canvas');c.width=c.height=128;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(64,64,54,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.font='bold 66px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n,64,68);
  const tex=new THREE.CanvasTexture(c);const label=new THREE.Mesh(new THREE.CircleGeometry(R*.28,24),new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false}));label.rotation.x=-Math.PI/2;label.position.y=R*.91;g.add(label);
 }
 g.position.set(x,BALL_Y,z);ballsRoot.add(g);return {n,mesh:g,x,z,vx:0,vz:0,active:true,spin:0};
}
function rack(){
 clearGroup(ballsRoot);balls=[];const nums=mode==='8'?[1,9,2,10,8,3,11,4,12,5,13,6,14,7,15]:[1,2,3,4,5,6,7,8,9];
 const d=R*2.02;let k=0;const rows=mode==='8'?5:5;
 for(let row=0;row<rows;row++)for(let col=0;col<=row;col++){if(k>=nums.length)continue;const x=.39+row*d*.87,z=(col-row/2)*d;balls.push(makeBall(nums[k++],x,z));}
 cueBall=makeBall(0,-.49,0);balls.push(cueBall);turn=1;shotActive=false;$('turnLabel').textContent='PLAYER 1';$('hint').textContent='Drag backwards from the cue ball, then release to shoot.';toast(mode+' BALL rack ready');
}
function fallback(){const g=new THREE.Group();const wood=new THREE.MeshStandardMaterial({color:0x4c2c1b,roughness:.5});const felt=new THREE.MeshStandardMaterial({color:0x075438,roughness:.95});const base=new THREE.Mesh(new THREE.BoxGeometry(2.105,.13,1.17),wood);base.position.y=.60;base.castShadow=true;g.add(base);const top=new THREE.Mesh(new THREE.BoxGeometry(1.72,.025,.82),felt);top.position.y=CLOTH_Y-.02;g.add(top);return g}
async function loadTable(){
 try{
  const mtl=await new MTLLoader().setPath('./assets/').loadAsync('PoolTable.mtl');mtl.preload();
  const obj=await new OBJLoader().setMaterials(mtl).setPath('./assets/').loadAsync('PoolTable.obj');
  // The supplied SketchUp model spans X=0..2.10486, Y=0..0.738041, Z=-1.17..0.
  // Center X/Z and place its highest tabletop surface at Y=0.738041.
  obj.position.set(-2.10486/2,-0.738041,0.585);
  obj.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(Array.isArray(o.material))o.material.forEach(m=>{m.side=THREE.DoubleSide;m.roughness=.72});else{o.material.side=THREE.DoubleSide;o.material.roughness=.72}}});
  tableRoot.add(obj);tableLoaded=true;
  // A restrained felt insert gives the play area a continuous surface if the source model has material gaps.
  const felt=new THREE.Mesh(new THREE.PlaneGeometry(1.70,.80),new THREE.MeshStandardMaterial({color:0x075638,roughness:.96,side:THREE.DoubleSide}));
  felt.rotation.x=-Math.PI/2;felt.position.set(0,CLOTH_Y+.001,0);felt.receiveShadow=true;tableRoot.add(felt);
  toast('Supplied 3D table loaded and centered.');
 }catch(err){console.error(err);tableRoot.add(fallback());toast('Table model could not load. Showing backup table.');}
}
function cameraView(v){
 controls.enabled=true;controls.target.set(0,.72,0);
 if(v==='top')camera.position.set(0,3.8,.001);
 if(v==='side')camera.position.set(3.35,1.35,.05);
 if(v==='angled')camera.position.set(2.55,2.25,3.15);
 if(v==='free'){camera.position.set(2.55,2.25,3.15);controls.minPolarAngle=.08;controls.maxPolarAngle=Math.PI*.49;}
 controls.update();
}
$('camera').onchange=e=>cameraView(e.target.value);
function setMode(m){mode=m;$('modeLabel').textContent=m==='8'?'8 BALL':'9 BALL';$('menu').style.display='none';rack()}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{selectedMode=b.dataset.mode;setMode(selectedMode)});
$('start').onclick=()=>setMode(selectedMode);
$('rack').onclick=rack;$('menuBtn').onclick=()=>$('menu').style.display='grid';
function worldPoint(e){const r=renderer.domElement.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-((e.clientY-r.top)/r.height*2-1);ray.setFromCamera(mouse,camera);const p=new THREE.Vector3();ray.ray.intersectPlane(playPlane,p);return p}
function cueNear(p){return cueBall&&Math.hypot(p.x-cueBall.x,p.z-cueBall.z)<.19}
renderer.domElement.addEventListener('pointerdown',e=>{if(!cueBall||shotActive||$('menu').style.display!=='none')return;const p=worldPoint(e);if(cueNear(p)){dragging=true;dragPoint=p;renderer.domElement.setPointerCapture(e.pointerId);drawCue(p)}});
renderer.domElement.addEventListener('pointermove',e=>{if(dragging)drawCue(worldPoint(e))});
renderer.domElement.addEventListener('pointerup',e=>{if(!dragging)return;const p=worldPoint(e),dx=cueBall.x-p.x,dz=cueBall.z-p.z,len=Math.hypot(dx,dz);if(len>.018){const slider=Number($('power').value)/100;const pull=Math.min(len,.48);const speed=(.7+slider*3.6)*(pull/.32+.35);cueBall.vx=dx/len*speed;cueBall.vz=dz/len*speed;shotActive=true;shotTimer=0;$('hint').textContent='Shot in motion. Wait for all balls to stop.';}dragging=false;clearGroup(aimRoot)});
function drawCue(p){clearGroup(aimRoot);if(!cueBall)return;let dx=cueBall.x-p.x,dz=cueBall.z-p.z,l=Math.hypot(dx,dz);if(l<.001)return;dx/=l;dz/=l;
 const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(cueBall.x,BALL_Y+.008,cueBall.z),new THREE.Vector3(cueBall.x+dx*.95,BALL_Y+.008,cueBall.z+dz*.95)]),new THREE.LineDashedMaterial({color:0xffdf9a,dashSize:.055,gapSize:.035}));line.computeLineDistances();aimRoot.add(line);
 const cue=new THREE.Mesh(new THREE.CylinderGeometry(.009,.016,.82,12),new THREE.MeshStandardMaterial({color:0xb58a52,roughness:.45}));cue.rotation.x=Math.PI/2;cue.rotation.z=Math.atan2(dz,dx);cue.position.set(cueBall.x-dx*.47,BALL_Y+.012,cueBall.z-dz*.47);aimRoot.add(cue);
}
const REST=.965, FRICTION=.994, RAIL=.84, RAILZ=.39;
function pocketCheck(b){for(const [px,pz] of POCKETS){if(Math.hypot(b.x-px,b.z-pz)<POCKET_R){b.active=false;b.mesh.visible=false;b.vx=b.vz=0;toast(b.n===0?'Cue ball scratched!':`Ball ${b.n} pocketed`);return true}}return false}
function physicsStep(dt){
 // Substepped 2D rigid-body simulation on the real table's felt plane.
 const sub=4,h=dt/sub;
 for(let step=0;step<sub;step++){
  for(const b of balls){if(!b.active)continue;b.x+=b.vx*h;b.z+=b.vz*h;b.vx*=Math.pow(FRICTION,h*60);b.vz*=Math.pow(FRICTION,h*60);
   if(Math.hypot(b.vx,b.vz)<.012)b.vx=b.vz=0;
   if(pocketCheck(b))continue;
   // Cushions. The six pocket mouths are deliberately left open.
   let inSidePocket=Math.abs(b.z)>RAILZ-.045&&Math.abs(b.x)<.115;
   let inCornerPocket=Math.abs(b.x)>RAIL-.035&&Math.abs(b.z)>RAILZ-.035;
   if(!inSidePocket&&!inCornerPocket){
    if(b.x>RAIL){b.x=RAIL;b.vx=-Math.abs(b.vx)*REST}
    if(b.x< -RAIL){b.x=-RAIL;b.vx=Math.abs(b.vx)*REST}
    if(b.z>RAILZ){b.z=RAILZ;b.vz=-Math.abs(b.vz)*REST}
    if(b.z< -RAILZ){b.z=-RAILZ;b.vz=Math.abs(b.vz)*REST}
   }
  }
  for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){
   const a=balls[i],b=balls[j];if(!a.active||!b.active)continue;
   let dx=b.x-a.x,dz=b.z-a.z,d2=dx*dx+dz*dz,min=R*2;
   if(d2<min*min){let d=Math.sqrt(Math.max(d2,.00000001)),nx=dx/d,nz=dz/d,over=min-d;
    a.x-=nx*over*.5;a.z-=nz*over*.5;b.x+=nx*over*.5;b.z+=nz*over*.5;
    const rel=(a.vx-b.vx)*nx+(a.vz-b.vz)*nz;
    if(rel>0){const impulse=(1+REST)*rel*.5;a.vx-=impulse*nx;a.vz-=impulse*nz;b.vx+=impulse*nx;b.vz+=impulse*nz;}
   }
  }
 }
 for(const b of balls)if(b.active){b.mesh.position.set(b.x,BALL_Y,b.z);const speed=Math.hypot(b.vx,b.vz);if(speed>.001)b.mesh.rotation.z-=speed*dt/R;}
 if(shotActive){shotTimer+=dt;if(balls.every(b=>!b.active||Math.hypot(b.vx,b.vz)<.012)){shotActive=false;turn=turn===1?2:1;$('turnLabel').textContent='PLAYER '+turn;$('hint').textContent='Drag backwards from the cue ball, then release to shoot.';toast('Balls stopped. Player '+turn+' to shoot.');}}
}
let last=performance.now();
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.025);last=now;if(shotActive)physicsStep(dt);controls.update();renderer.render(scene,camera)}
requestAnimationFrame(animate);
loadTable().then(()=>{rack();cameraView('angled')});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
